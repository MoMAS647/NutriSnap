<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245a40"><link rel="manifest" href="manifest.json"><title>NutriSnap</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7ef;color:#243c30;font:16px system-ui,sans-serif}main{max-width:550px;margin:auto;padding:24px 20px 100px}header{font-weight:800;font-size:25px;color:#245a40;letter-spacing:-1px}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:36px;margin:24px 0 8px}small,p{color:#607467}section{background:white;border:1px solid #e1e8dc;border-radius:20px;padding:18px;margin:14px 0}label{display:block;font-size:13px;margin:12px 0 4px}input,select,button{font:inherit;border:1px solid #d9e2d6;border-radius:10px;padding:11px;width:100%;background:white;color:inherit}button{background:#245a40;color:white;cursor:pointer;margin-top:8px;border:0}button.alt{background:#e7eee4;color:#245a40}button.danger{background:#f4e7e2;color:#8b3d2e}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,550px);display:flex;background:white;padding:8px 8px max(12px,env(safe-area-inset-bottom));box-shadow:0 -3px 20px #0001}nav button{background:white;color:#245a40;font-size:13px;padding:10px 2px;margin:0}nav button.active{background:#e7eee4} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.macros div{background:#edf3e9;border-radius:12px;padding:10px;font-size:12px}.macros b{display:block;font-size:21px}.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:auto}.ring div{background:white;width:124px;height:124px;border-radius:50%;display:grid;place-content:center;text-align:center}.ring b{font-size:29px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.row button{width:auto;margin:0}.error{color:#a33131}svg{width:100%;height:auto} .muted{font-size:12px}img{max-width:100%;border-radius:12px}input,select{min-width:0;max-width:100%}input[type=date]{display:block;-webkit-appearance:none} .grid>*{min-width:0} #results{max-height:280px;overflow:auto}</style><main><header>◉ NutriSnap</header><div id="view"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), key='nutrisnap-v1-local';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}state=state||{profile:null,meals:[],weights:[]};let page='Today',date=day(),edit=null,photo='';function day(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{alert('Device storage is full. Export your data and remove older photos.');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const foods=[['Egg (one large)',72,6.3,.4,4.8,0,.2,71],['Chicken breast (100 g)',165,31,0,3.6,0,0,74],['Cooked rice (100 g)',130,2.7,28,.3,.4,.1,1],['Oats (40 g)',156,6.8,26.5,2.8,4.2,.4,1],['Banana (medium)',105,1.3,27,.4,3.1,14,1],['Greek yoghurt (100 g)',97,9,3.9,5,0,3.6,35],['Spinach (100 g)',23,2.9,3.6,.4,2.2,.4,79],['Salmon (100 g)',206,22,0,12,0,0,63],['Wholemeal bread (slice)',90,4,15,1.3,2.5,2,150],['Apple (medium)',95,.5,25,.3,4.4,19,2],['Olive oil (tbsp)',119,0,0,13.5,0,0,0],['Cooked lentils (100 g)',116,9,20,.4,7.9,1.8,2],['Hummus (100 g)',166,8,14,10,6,0,380],['Cooked pasta (100 g)',158,5.8,31,.9,1.8,.6,1],['Milk (200 ml)',100,7,9.6,3.6,0,9.6,88],['Tomato (medium)',22,1.1,4.8,.2,1.5,3.2,6]];foods.push(...[['Potato boiled (100 g)',87,1.9,20,.1,1.8,.9,4],['Cucumber (100 g)',15,.7,3.6,.1,.5,1.7,2],['Avocado (100 g)',160,2,8.5,14.7,6.7,.7,7],['Chickpeas cooked (100 g)',164,8.9,27.4,2.6,7.6,4.8,7],['Tuna in water drained (100 g)',116,25.5,0,.8,0,0,247],['Orange (100 g)',47,.9,11.8,.1,2.4,9.4,0],['Almonds (100 g)',579,21.2,21.6,49.9,12.5,4.4,1],['Broccoli cooked (100 g)',35,2.4,7.2,.4,3.3,1.4,41],['Carrots raw (100 g)',41,.9,9.6,.2,2.8,4.7,69],['Bulgur cooked (100 g)',83,3.1,18.6,.2,4.5,.1,5],['Dates (100 g)',277,1.8,75,.2,6.7,66.5,1],['Feta (100 g)',265,14.2,3.9,21.5,0,3.9,1139]]);const names=['Calories','Protein','Carbs','Fat','Fibre','Sugar','Sodium'];const units=['kcal','g','g','g','g','g','mg'];const total=ms=>names.map((_,i)=>ms.reduce((s,m)=>s+m.n[i]*m.qty,0));const fmt=n=>Math.round(n*10)/10;function go(p){page=p;edit=null;photo='';render()}function field(id,label,value='',type='number'){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any" min="0"':''} required>`}function render(){ $('nav').innerHTML=state.profile?['Today','Log','Progress','Settings'].map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join(''):'';if(!state.profile){$('view').innerHTML=`<h1>Feel good about what you eat.</h1><p>Your private nutrition journal.</p><section><form onsubmit="setup(event)">${field('age','Age (18+)')}${field('height','Height (cm)')}${field('weight','Weight (kg)')}${field('target','Goal weight (kg)')}<label>Sex for energy estimate</label><select id="sex"><option value="-161">Female</option><option value="5">Male</option><option value="-78">Midpoint estimate</option></select><label>Activity</label><select id="activity"><option value="1.2">Mostly sitting</option><option value="1.375">Lightly active</option><option value="1.55">Moderately active</option><option value="1.725">Very active</option></select><label>Goal</label><select id="goal"><option value="0">Maintain</option><option value="-250">Lose gradually</option><option value="250">Gain gradually</option></select><p class="muted">Adult estimates only; not suitable for pregnancy or clinical nutrition needs.</p><button>Get started</button></form></section>`;return}let ms=state.meals.filter(m=>m.date===date),t=total(ms),g=state.profile.goal;if(page==='Today'){$('view').innerHTML=`<h1>Your day</h1><input type="date" value="${date}" onchange="date=this.value;render()"><section><div class="ring" style="background:conic-gradient(#397b55 ${Math.min(100,t[0]/g*100)}%,#e8eee4 0)"><div><b>${fmt(t[0])}</b><small>kcal logged</small></div></div><p style="text-align:center">${fmt(Math.abs(g-t[0]))} kcal ${g>=t[0]?'remaining':'above target'} · Goal ${g}</p><div class="macros">${names.slice(1).map((n,i)=>`<div>${n}<b>${fmt(t[i+1])}${units[i+1]}</b></div>`).join('')}</div></section><button onclick="go('Log')">+ Log food</button><h2>Meal journal</h2>${['Breakfast','Lunch','Dinner','Snack'].map(type=>`<section><b>${type}</b>${ms.filter(m=>m.type===type).map(m=>`<div class="row"><span>${esc(m.name)}<br><small>${fmt(m.n[0]*m.qty)} kcal</small></span><button class="alt" onclick="editMeal('${m.id}')">Edit</button></div>${m.photo?`<img src="${esc(m.photo)}" alt="Meal photo">`:''}`).join('')||'<p>Nothing logged yet</p>'}</section>`).join('')}`;return}if(page==='Log'){let m=edit?state.meals.find(x=>x.id===edit):null;$('view').innerHTML=`<h1>${m?'Edit meal':'Log a meal'}</h1><section><form onsubmit="log(event)"><label>Meal</label><select id="type">${['Breakfast','Lunch','Dinner','Snack'].map(x=>`<option ${m?.type===x?'selected':''}>${x}</option>`).join('')}</select><label>Date</label><input id="mealdate" type="date" required value="${m?.date||date}"><label>Search common foods</label><input id="search" placeholder="Search food or enter your own below" oninput="searchFood()"><div id="results"></div><button type="button" class="alt" onclick="clearFood()">Enter custom food</button><label>Packaged food search / barcode number</label><input id="productquery" placeholder="Product name or barcode"><button type="button" class="alt" onclick="lookupProduct()">Search Open Food Facts</button><div id="products" aria-live="polite"></div><p class="muted">Search sends the product name or barcode to Open Food Facts. Check values against the label.</p>${field('foodname','Food name',m?.name||'','text')}${field('qty','Number of portions (e.g. 1.5 for 150 g if per 100 g)',m?.qty||1)}<div class="grid">${names.map((n,i)=>field('n'+i,n+' per portion ('+units[i]+')',m?.n[i]??0)).join('')}</div><label>Optional meal photo (stored locally)</label><input type="file" accept="image/*" onchange="readPhoto(this.files[0])"><div id="preview">${photo?`<img src="${esc(photo)}">`:''}</div><p class="muted">Photo recognition is not connected yet. Enter nutrition manually or select a food. Common food values are approximate. Packaged food data is community contributed.</p><button>Save meal</button>${m?'<button type="button" class="danger" onclick="removeMeal()">Delete meal</button>':''}</form></section>`;searchFood();return}if(page==='Progress'){let w=state.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)),p=state.profile,last=w.at(-1)?.kg??p.weight,bmi=last/(p.height/100)**2,points=[{kg:p.weight},...w],lo=Math.min(...points.map(x=>x.kg))-1,hi=Math.max(...points.map(x=>x.kg))+1;$('view').innerHTML=`<h1>Your progress</h1><section><h2>${last} kg</h2><p>Change: ${fmt(last-p.weight)} kg · BMI ${fmt(bmi)} · Goal ${p.target} kg</p><p>Goal progress: ${p.target===p.weight?'Maintenance':Math.round(Math.max(0,Math.min(1,(last-p.weight)/(p.target-p.weight)))*100)+'%'}</p><svg viewBox="0 0 300 120"><polyline fill="none" stroke="#397b55" stroke-width="3" points="${points.map((x,i)=>`${10+i*280/Math.max(1,points.length-1)},${110-(x.kg-lo)/(hi-lo)*100}`).join(' ')}"/></svg></section><section><form onsubmit="weigh(event)">${field('kg','Weight (kg)',last)}<label>Waist (cm, optional)</label><input id="waist" type="number" min="1" step="any"><button>Save weight</button></form>${w.slice().reverse().map(x=>`<div class="row"><span>${x.date}: ${x.kg} kg ${x.waist?'· waist '+x.waist+' cm':''}</span><button class="alt" onclick="removeWeight('${x.id}')">Delete</button></div>`).join('')}</section><section><h2>Nutrition history</h2><select id="period" onchange="historyChart()"><option value="7">7 days</option><option value="30">30 days</option><option value="1">Today</option></select><div id="hist"></div></section>`;historyChart();return}$('view').innerHTML=`<h1>Settings</h1><section><form onsubmit="setGoal(event)">${field('newgoal','Daily calorie target',g)}<button>Update target</button></form><button class="alt" onclick="exportData()">Export CSV</button><button class="alt" onclick="window.print()">Print current view / PDF</button><button class="danger" onclick="resetData()">Erase all local data</button></section><p>Data is saved in this browser, not synced. Clearing browser data removes your journal. Export regularly. AI and reminders are not connected.</p>`}function setup(e){e.preventDefault();let a=+$('age').value,h=+$('height').value,w=+$('weight').value,t=+$('target').value;if(a<18||a>110||h<100||h>230||w<25||w>350||t<25||t>350)return alert('Enter valid adult measurements.');let goal=Math.round(Math.max(1200,(10*w+6.25*h-5*a+ +$('sex').value)* +$('activity').value+ +$('goal').value));state.profile={age:a,height:h,weight:w,target:t,goal};save();render()}function searchFood(){let q=$('search').value.toLowerCase();$('results').innerHTML=foods.map((f,i)=>({f,i})).filter(x=>x.f[0].toLowerCase().includes(q)).slice(0,50).map(x=>`<button type="button" class="alt" onclick="pick(${x.i})">${esc(x.f[0])} · ${x.f[1]} kcal</button>`).join('')}function pick(i){let f=foods[i];$('foodname').value=f[0];f.slice(1).forEach((n,j)=>$('n'+j).value=n)}function clearFood(){ $('foodname').value='';$('qty').value=1;names.forEach((_,i)=>$('n'+i).value='');$('foodname').focus()}let products=[];async function lookupProduct(){let q=$('productquery').value.trim(),out=$('products');if(!q)return;out.textContent='Searching…';try{let fields='product_name,nutriments,code';let url=/^\d{8,14}$/.test(q)?'https://world.openfoodfacts.org/api/v2/product/'+q+'.json?fields='+fields:'https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=15&fields='+fields;let r=await fetch(url);if(!r.ok)throw Error();let d=await r.json();products=(d.products||[d.product]).filter(p=>p?.product_name&&Number.isFinite(Number(p.nutriments?.['energy-kcal_100g']))&&p.nutriments?.['energy-kcal_100g']!=null);if(!out.isConnected)return;out.innerHTML=products.map((p,i)=>`<button type="button" class="alt" onclick="pickProduct(${i})">${esc(p.product_name)} · ${esc(p.nutriments['energy-kcal_100g'])} kcal / 100 g</button>`).join('')||'No matching products. Try manual entry.'}catch{out.textContent='Search unavailable. Try again later or enter manually.'}}function pickProduct(i){let p=products[i],n=p.nutriments; $('foodname').value=p.product_name+' (100 g)';$('qty').value=1;let keys=['energy-kcal','proteins','carbohydrates','fat','fiber','sugars','sodium'];keys.forEach((k,j)=>{let v=n[k+'_100g'];$('n'+j).value=v==null?'':fmt(Number(v)*(j===6?1000:1))});alert('Values are per 100 g. Set portions to grams divided by 100. Fill missing values from the label before saving.')}function readPhoto(f){if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,800/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65);$('preview').innerHTML=`<img src="${photo}">`;URL.revokeObjectURL(url)};img.src=url}function log(e){e.preventDefault();let qty=+$('qty').value,n=names.map((_,i)=>+$('n'+i).value);if(qty<=0||n.some(x=>!Number.isFinite(x)||x<0)||!$('foodname').value.trim())return alert('Enter valid food and portions');let m={id:edit||String(Date.now()),name:$('foodname').value.trim(),date:$('mealdate').value,type:$('type').value,qty,n,photo};let old=state.meals;state.meals=[...old.filter(x=>x.id!==edit),m];if(!save()){state.meals=old;return}date=m.date;go('Today')}function editMeal(id){edit=id;photo=state.meals.find(x=>x.id===id).photo||'';page='Log';render()}function removeMeal(){if(confirm('Delete this meal?')){state.meals=state.meals.filter(x=>x.id!==edit);save();go('Today')}}function weigh(e){e.preventDefault();let kg=+$('kg').value;if(kg<25||kg>350)return alert('Enter a valid weight');state.weights.push({id:String(Date.now()),date:day(),kg,waist:+$('waist').value||null});save();render()}function removeWeight(id){if(confirm('Delete weight?')){state.weights=state.weights.filter(x=>x.id!==id);save();render()}}function historyChart(){let days=+$('period').value,arr=[];for(let i=days-1;i>=0;i--){let d=new Date(day()+'T12:00:00');d.setDate(d.getDate()-i);let k=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');arr.push([k,total(state.meals.filter(m=>m.date===k))[0]])}$('hist').innerHTML=arr.map(([d,n])=>`<div class="row"><small>${d}</small><div style="flex:1;background:#edf3e9;height:9px;border-radius:5px"><div style="height:9px;background:#397b55;width:${Math.min(100,n/state.profile.goal*100)}%;border-radius:5px"></div></div><small>${fmt(n)} kcal</small></div>`).join('')}function setGoal(e){e.preventDefault();let g=+$('newgoal').value;if(g<1200||g>6000)return alert('Choose a target between 1200 and 6000 kcal.');state.profile.goal=g;save();render()}function exportData(){let rows=[['Date','Type','Food','Portions',...names],...state.meals.map(m=>[m.date,m.type,m.name,m.qty,...m.n.map(x=>fmt(x*m.qty))]),[],['Weight date','kg','Waist cm'],...state.weights.map(w=>[w.date,w.kg,w.waist??''])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='nutrisnap.csv';a.click()}function resetData(){if(confirm('Erase all meals, weight and profile?')){state={profile:null,meals:[],weights:[]};save();go('Today')}}render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
